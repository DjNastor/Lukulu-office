<body><div id="app" class="app"><aside class="sidebar"><div class="brand"><div class="brandmark">L<span>◆</span></div><div><strong>LUKULU <em>HQ</em></strong><small>RECORDINGS · LABEL OFFICE</small></div></div><div class="nav-label">WORKSPACE</div><nav id="nav" class="nav" aria-label="Main navigation"></nav><div class="sidebar-footer"><div class="local-dot"></div><div><strong>Local workspace</strong><small>Data saved on this device</small></div></div></aside><main class="main"><header class="topbar"><div class="breadcrumb"><span class="overline">LABEL OPERATIONS /</span><strong id="crumb">Overview</strong></div><div class="top-actions"><button class="ghost iconbutton" id="search-btn" title="Search and commands" aria-label="Search">⌕</button><button class="ghost iconbutton" id="notify-btn" title="Attention items" aria-label="Attention items">♧<i id="notify-dot"></i></button><div class="avatar">LR</div></div></header><div class="content" id="content"></div></main></div>
<div id="modal-root"></div><div id="toast" role="status" aria-live="polite"></div><div class="mobile-nav" id="mobile-nav" aria-label="Mobile navigation"></div><input type="file" id="upload" accept=".csv,.json,text/csv,application/json" hidden><div id="print-target"></div><script>window.LUKULU_SEED = {"catalog": [], "contacts": [], "campaigns": [], "registrations": [], "royalties": [], "contracts": [], "tasks": [], "settings": {"publisherEmail": "", "company": "Lukulu Recordings"}};
</script><script>(()=>{'use strict';
const KEY='lukulu-hq-v32-1-database';

const TYPES=['catalog','contacts','campaigns','registrations','royalties','contracts','tasks'];
const FIELDS={
 catalog:[['title','Track title','text',true],['artist','Artist / collaborators','text',true],['isrc','ISRC'],['upc','UPC'],['genre','Genre'],['status','Stage','select:Planning|Ready|Released|Archived'],['spotify','Spotify track URL','url'],['writers','Writers and shares (e.g. Alice:50; Bob:50)'],['notes','Notes','textarea']],
 contacts:[['name','Name / organization','text',true],['email','Email address','email'],['category','Contact type','select:Radio|Curator|Promoter|Publisher|Other'],['country','Country'],['status','Verification','select:Unverified|Verified manually'],['notes','Notes','textarea']],
 campaigns:[['name','Campaign name','text',true],['track','Track / release'],['platform','Platform'],['status','Status','select:Draft|Planned|Sent|In progress|Completed'],['date','Date','date'],['notes','Notes','textarea']],
 registrations:[['track','Track name / ISRC','text',true],['society','Organization','select:SAMRO|SAMPRA|CAPASSO|RISA|Other'],['reference','Reference number'],['status','Status','select:Missing|Pending|Submitted|Registered|Rejected'],['date','Last updated','date'],['notes','Notes','textarea']],
 royalties:[['track','Track / statement','text',true],['source','Source'],['amount','Amount (ZAR)','number'],['period','Period'],['status','Payment status','select:Expected|Pending|Paid'],['notes','Notes','textarea']],
 contracts:[['name','Contract title','text',true],['party','Other party'],['type','Type','select:Licensing|Collaboration|Remix|Publishing|Services|Other'],['status','Status','select:Draft|Sent|Signed|Expired'],['date','Date','date'],['notes','Notes','textarea']],
 tasks:[['title','Task title','text',true],['type','Area','select:Catalog|Radio|Distribution|Publishing|Legal|Finance|Other'],['due','Due date','date'],['status','Status','select:To do|In progress|Done'],['notes','Notes','textarea']]
};
const ESC=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const attr=ESC;
const $=s=>document.querySelector(s);

function initData(){const fallback=JSON.parse(JSON.stringify(window.LUKULU_SEED||{}));for(const t of TYPES)fallback[t]??=[]; fallback.settings??={};try{let raw=localStorage.getItem(KEY);if(!raw)return fallback;const parsed=JSON.parse(raw);for(const t of TYPES)if(!Array.isArray(parsed[t]))throw Error('Invalid '+t);if(typeof parsed.settings!=='object')throw Error('Invalid settings');return parsed}catch(e){alert('Saved data could not be loaded. The original browser copy has not been overwritten. Export it manually before saving new records.');console.error(e);return fallback;}}
let db=initData();let view='dashboard',search='',selectFilter='all',importTarget='catalog',toastTimer;

function counts(){return{tracks:db.catalog.length,contacts:db.contacts.length,registrations:db.registrations.filter(x=>x.status==='Missing'||x.status==='Pending').length,royalties:db.royalties.filter(x=>x.status!=='Paid').reduce((n,x)=>n+(Number(x.amount)||0),0),tasks:db.tasks.filter(x=>x.status!=='Done').length};}
function attention(){return [...db.registrations.filter(x=>['Missing','Pending','Rejected'].includes(x.status)).map(x=>({label:`${x.society}: ${x.track}`,sub:`Registration · ${x.status}`})),...db.tasks.filter(x=>x.status!=='Done').map(x=>({label:x.title,sub:`Task · ${x.due?dateFmt(x.due):'No due date'}`}))].slice(0,10)}
function nav(){const nav=$('#nav');nav.innerHTML=Object.entries(LABELS).map(([k,[text,sym]])=>`<button data-page="${k}" class="${view===k?'active':''}" aria-current="${view===k?'page':'false'}"><span class="sym">${sym}</span>${ESC(text)}</button>`).join('');$('#mobile-nav').innerHTML=['dashboard','catalog','contacts','tasks','settings'].map(k=>`<button data-page="${k}" class="${view===k?'active':''}"><span class="sym">${LABELS[k][1]}</span>${k==='dashboard'?'Home':ESC(LABELS[k][0].split(' ')[0])}</button>`).join('');$('#crumb').textContent=LABELS[view][0];$('#notify-dot').style.display=attention().length?'block':'none';}
function dashboard(){const c=counts(),max=Math.max(1,...['catalog','contacts','registrations','tasks'].map(k=>db[k].length));return header('Command your music business.','Your offline-first label operations workspace. Only actual saved records are counted.',btn('add-catalog','+ New release','primary')+btn('backup','↓ Back up'))+
`<div class="metrics"><div class="metric"><span class="m-icon">♫</span><label>CATALOG TRACKS</label><strong class="num">${c.tracks}</strong><small>Saved music inventory</small></div><div class="metric"><span class="m-icon">♙</span><label>CRM CONTACTS</label><strong class="num">${c.contacts}</strong><small>Only records you import</small></div><div class="metric"><span class="m-icon">▤</span><label>REGISTRATIONS TO REVIEW</label><strong class="num">${c.registrations}</strong><small>Missing or pending</small></div><div class="metric"><span class="m-icon">◈</span><label>EXPECTED / PENDING</label><strong class="num">${money(c.royalties)}</strong><small>Unpaid local entries</small></div></div>
<div class="warning">Offline mode is active: this app does not automatically send releases, emails, or registrations. No third-party account is connected yet.</div>
<div class="columns"><div><section class="panel"><div class="panel-head"><h2>Workspace activity</h2><small>Actual saved records</small></div>${['catalog','contacts','registrations','tasks'].map(k=>`<div class="chartrow"><span>${ESC(LABELS[k][0])}</span><div class="trackbar"><div style="width:${Math.round(db[k].length/max*100)}%"></div></div><b>${db[k].length}</b></div>`).join('')}</section><section class="panel"><div class="panel-head"><h2>Quick actions</h2><small>Working locally</small></div><div class="quick-grid">${[['add-catalog','New track','Add to catalog'],['add-contacts','Add contact','Build your CRM'],['add-registrations','Track registration','SAMRO / SAMPRA'],['add-campaigns','New campaign','Manage promotion'],['import-catalog','Import CSV','Bring your catalog'],['backup','Data backup','Save a JSON file']].map(x=>`<button class="quick" data-action="${x[0]}"><strong>${x[1]}</strong><span>${x[2]}</span></button>`).join('')}</div></section></div><div><section class="panel"><div class="panel-head"><h2>Needs attention</h2><small>${c.tasks} open tasks</small></div>${attention().length?`<div class="mini-list">${attention().slice(0,5).map(x=>`<div class="mini-row"><div><div class="primary">${ESC(x.label)}</div><div class="secondary">${ESC(x.sub)}</div></div><span class="pill amber">Review</span></div>`).join('')}</div>`:`<div class="empty">You're clear. Create a task or registration to track work here.</div>`}</section><section class="panel"><div class="panel-head"><h2>Business integrations</h2><small>Connection check</small></div>${[['Paradise / distribution','Not connected'],['Meta Business','Not connected'],['Rights societies','Manual tracking']].map(x=>`<div class="mini-row"><span class="primary">${x[0]}</span>${pill(x[1])}</div>`).join('')}${btn('go-integrations','See connections','secondary','style="margin-top:13px"')}</section></div></div>`;}
function dataTable(type){const labels={catalog:['Music catalog','Add tracks, manage metadata and generate printable writer split sheets.'],contacts:['Contacts & radio','Keep contacts organized. Original ZIP sample data is not independently verified.'],campaigns:['Campaign manager','Plan promotion and log submissions. Sends require a connected provider.'],registrations:['Rights registration tracker','Track SAMRO, SAMPRA, CAPASSO and RISA submissions and reconciliation.'],royalties:['Royalty ledger','Capture statement amounts in South African Rand and track payments.'],contracts:['Contract registry','Track agreement status; signed files are not stored in this offline version.'],tasks:['Task manager','Set deadlines and track operational work.']}[type]; const rows=db[type].filter(r=>{const hay=Object.values(r).join(' ').toLowerCase();return hay.includes(search.toLowerCase()) && (selectFilter==='all'||String(r.status||r.category||'')===selectFilter)});
const unique=[...new Set(db[type].map(r=>String(r.status||r.category||'')).filter(Boolean))];const title={catalog:'title',contacts:'name',campaigns:'name',registrations:'track',royalties:'track',contracts:'name',tasks:'title'}[type];const secondary={catalog:'artist',contacts:'email',campaigns:'track',registrations:'society',royalties:'source',contracts:'party',tasks:'type'}[type];
return header(labels[0],labels[1],btn(`add-${type}`,'+ Add record','primary')+btn(`import-${type}`,'↑ Import CSV')+btn(`export-${type}`,'↓ Export CSV'))+`<section class="panel"><div class="toolbar"><input type="search" id="table-search" placeholder="Search ${ESC(type)}..." value="${attr(search)}" aria-label="Search records"><select id="filter"><option value="all">All statuses / categories</option>${unique.map(x=>`<option ${selectFilter===x?'selected':''}>${ESC(x)}</option>`).join('')}</select></div><div class="tablewrap"><table class="data-table"><thead><tr><th>${type==='catalog'?'Track':'Record'}</th><th>Category / type</th><th>Status / notes</th><th>Actions</th></tr></thead><tbody>${rows.map(r=>`<tr><td><span class="name">${ESC(str(r,title))}</span><span class="sub">${ESC(str(r,secondary))}</span></td><td>${ESC(str(r,({catalog:'genre',contacts:'country',campaigns:'platform',registrations:'reference',royalties:'period',contracts:'type',tasks:'due'})[type])||'—')}</td><td>${r.status?pill(r.status):`<span class="muted">${ESC(str(r,'notes').slice(0,65)||'—')}</span>`}${type==='royalties'?`<span class="sub">${money(r.amount)}</span>`:''}</td><td><div class="row-actions"><button class="tiny" data-action="edit" data-type="${type}" data-id="${attr(r.id)}">Edit</button>${type==='catalog'?`<button class="tiny" data-action="print-split" data-id="${attr(r.id)}">Split sheet</button>`:''}<button class="tiny" data-action="delete" data-type="${type}" data-id="${attr(r.id)}">Delete</button></div></td></tr>`).join('')||`<tr><td colspan="4" class="empty">No records found. Add one or import a CSV.</td></tr>`}</tbody></table></div><div class="muted" style="font-size:11px;margin-top:18px">${rows.length} of ${db[type].length} locally saved record(s).</div></section>`;
}
const INTEGRATIONS=[
 ['Paradise Direct Pro','Distribution','Requires distributor partner/API approval or manual portal workflow','https://www.paradise-distribution.com/'],
 ['Meta Business','Social media publishing','Requires Meta developer app review and an authorized business connection','https://developers.facebook.com/'],
 ['Spotify for Artists','Artist analytics','No Spotify token or account connected','https://artists.spotify.com/'],
 ['SAMRO','Composer & publisher rights','Manual submission status tracking only','https://www.samro.org.za/'],
 ['SAMPRA','Neighbouring rights','CSV imports and reconciliation can be tracked locally','https://www.sampra.org.za/'],
 ['CAPASSO','Mechanical rights','Manual portal and reference tracking','https://www.capasso.co.za/'],
 ['RISA','ISRC and industry data','No direct registration API configured','https://www.risa.org.za/'],
 ['Gmail','Publisher submissions','Email draft links only; no OAuth sending','https://mail.google.com/']
];
function integrations(){return header('Connections & automation','Real integration status — no simulated API success.',btn('backup','Back up data'))+`<div class="notice">External publishing, distributor uploads, email sending, social scheduling, royalty retrieval, notifications and AI processing require authenticated back-end integrations. Do not paste secret API keys into this local app.</div><div class="status-grid">${INTEGRATIONS.map(i=>`<article class="integration"><div class="label"><strong>${ESC(i[0])}</strong><span class="pill amber">Not connected</span></div><p>${ESC(i[2])}</p><a href="${attr(i[3])}" target="_blank" rel="noopener noreferrer">Official portal / developer documentation</a></article>`).join('')}</div>`;}
function settings(){return header('Settings & backups','This build stores entries in the browser on this device. It has no cloud sync.',btn('backup','↓ Download backup','primary'))+`<div class="columns"><section class="panel"><div class="panel-head"><h2>Organization</h2></div><div class="formgrid"><label class="wide">Label name<input class="field" id="company-input" value="${attr(db.settings.company||'Lukulu Recordings')}"></label><label class="wide">Publisher email for draft submissions<input class="field" type="email" id="publisher-input" value="${attr(db.settings.publisherEmail||'')}" placeholder="publisher@example.com"></label></div><div class="actions" style="margin-top:20px">${btn('save-settings','Save preferences','primary')}${btn('email-draft','Open email draft')}</div></section><section class="panel"><div class="panel-head"><h2>Import / export</h2></div><p class="muted" style="font-size:12px;line-height:1.6">Export a full JSON backup before changing phones or clearing browser data. CSV imports are also supported per section. JSON restore replaces the locally saved workspace.</p><div class="actions" style="margin-top:18px">${btn('backup','Download full JSON')}${btn('restore','Restore JSON')}${btn('clear-all','Reset data','danger')}</div></section></div><section class="panel"><div class="panel-head"><h2>Installation health</h2></div><div class="checklist"><div class="checkline"><span>Secure origin / PWA install eligibility</span>${pill(location.protocol==='https:'||location.hostname==='localhost'?'HTTPS / local dev':'Requires HTTPS hosting')}</div><div class="checkline"><span>Local storage</span>${pill('Active on this browser')}</div><div class="checkline"><span>Offline service worker</span>${pill('serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='localhost')?'Supported':'Not available on file://')}</div><div class="checkline"><span>Android APK / signed app</span><span class="pill amber">Not packaged</span></div><div class="checkline"><span>Cloud sync / account logins</span><span class="pill amber">Not configured</span></div></div></section>`;}
function openForm(type,id=''){const row=id?db[type].find(x=>String(x.id)===String(id)):null; if(id&&!row)return notify('Record not found',true);const fields=FIELDS[type].map(([key,label,kind='text',required])=>{let value=String(row?.[key]??'');if(kind.startsWith('select:'))return `<label>${ESC(label)}<select name="${key}">${kind.slice(7).split('|').map(x=>`<option ${x===value?'selected':''}>${ESC(x)}</option>`).join('')}</select></label>`;if(kind==='textarea')return `<label class="wide">${ESC(label)}<textarea name="${key}">${ESC(value)}</textarea></label>`;return `<label class="${['title','name','track','notes'].includes(key)?'wide':''}">${ESC(label)}<input name="${key}" type="${kind}" value="${attr(value)}" ${required?'required':''} ${kind==='number'?'step="0.01" min="0"':''} maxlength="500"></label>`}).join('');
$('#modal-root').innerHTML=`<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="Edit record"><div class="modalhead"><h2>${row?'Edit':'New'} ${ESC(type.slice(0,-1))}</h2><button data-action="close" class="tiny" aria-label="Close">✕</button></div><form id="record-form" data-type="${type}" data-id="${attr(id)}"><div class="formgrid">${fields}</div><div class="formfooter"><button type="button" data-action="close" class="btn secondary">Cancel</button><button type="submit" class="btn">Save record</button></div></form></div></div>`;$('#record-form').addEventListener('submit',saveForm);}
function saveForm(e){e.preventDefault();const f=e.currentTarget, type=f.dataset.type,id=f.dataset.id;const row=id?db[type].find(x=>String(x.id)===String(id)):null;if(id&&!row)return;const entry={...(row||{}),id:id||uid()};for(const [k]of FIELDS[type])entry[k]=String(f.elements[k]?.value||'').trim();if(type==='catalog'&&entry.isrc&&!/^[A-Z]{2}[A-Z0-9]{3}\d{7}$/i.test(entry.isrc))return notify('ISRC should be 12 characters (e.g. ZAABC2600001).',true);if(type==='catalog'&&entry.writers){try{const s=parseWriters(entry.writers);if(s.reduce((t,x)=>t+x.pct,0)>100.00001)return notify('Writer shares cannot exceed 100%.',true)}catch(er){return notify(er.message,true)}}if(row)Object.assign(row,entry);else db[type].unshift(entry);if(!persist())return;close();render();notify('Record saved on this device.');}
function parseWriters(s){if(!s||!s.trim())return [];return s.split(';').filter(x=>x.trim()).map(part=>{let i=part.lastIndexOf(':');if(i<1)throw Error('Writer shares need Name:percentage; Name:percentage');let name=part.slice(0,i).trim(),pct=Number(part.slice(i+1).trim());if(!name||!Number.isFinite(pct)||pct<0||pct>100)throw Error('Writer shares must have valid percentages 0–100');return {name,pct}})}
function close(){$('#modal-root').innerHTML=''}
function download(filename,content,mime){if(window.AndroidBridge&&typeof window.AndroidBridge.saveText==='function'){window.AndroidBridge.saveText(filename,mime,content);notify('Select a location to save your file.');return;}const b=new Blob([content],{type:mime});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}
function backup(){download('lukulu-hq-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({format:'lukulu-hq-v32.1',exportedAt:new Date().toISOString(),data:db},null,2),'application/json');notify('Backup downloaded. Keep it somewhere safe.');}
function csvVal(s){let v=String(s??'');if(/^[=+@\-\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'}
function exportCSV(type){const cols=FIELDS[type].map(x=>x[0]);const content=[cols.join(','),...db[type].map(x=>cols.map(k=>csvVal(x[k])).join(','))].join('\r\n');download(`lukulu-${type}.csv`,content,'text/csv;charset=utf-8');notify('CSV exported.');}
function parseCSV(s){const data=[];let row=[],cell='',inside=false;for(let i=0;i<s.length;i++){const c=s[i];if(inside){if(c==='"'&&s[i+1]==='"'){cell+='"';i++}else if(c==='"')inside=false;else cell+=c}else if(c==='"')inside=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell.replace(/\r$/,''));data.push(row);row=[];cell=''}else cell+=c}if(inside)throw Error('CSV has unclosed quotes');if(cell||row.length){row.push(cell.replace(/\r$/,''));data.push(row)}return data.filter(r=>r.some(v=>v.trim()))}
function importCSV(type,text){const rows=parseCSV(text);if(rows.length<2)throw Error('CSV needs a header and at least one row.');const headers=rows[0].map(x=>x.trim().toLowerCase().replace(/[^a-z0-9]/g,''));const aliases={catalog:{title:['tracktitle','song','songtitle','track','title'],artist:['artistname','artists','performer'],isrc:['isrccode'],upc:['barcode','ean'],writers:['splits','writersshares']},contacts:{name:['organization','fullname','station','company'],email:['emailaddress','contactemail'],category:['type','category','contacttype'],country:['location']},registrations:{track:['song','title','isrc'],society:['organization','societyname']}};
let created=0;for(const raw of rows.slice(1)){const row={id:uid()};for(const [key] of FIELDS[type]){const options=[key,...(aliases[type]?.[key]||[])].map(x=>x.replace(/[^a-z0-9]/g,''));const found=options.map(x=>headers.indexOf(x)).find(x=>x>=0);row[key]=found===undefined?'':String(raw[found]??'').trim()}const primary=FIELDS[type][0][0];if(!row[primary])continue;if(type==='contacts'&&!row.status)row.status='Unverified';db[type].push(row);created++}if(!created)throw Error('No matching records found. Check the CSV headers.');if(!persist())return;notify(`${created} record(s) imported locally.`);search='';selectFilter='all';render();}
function submitEmailDraft(){const address=(db.settings.publisherEmail||'').trim();if(!address||!/^\S+@\S+\.\S+$/.test(address))return notify('Set a valid publisher email in Settings.',true);let sub='Lukulu Recordings – Catalog Submission';let body='Hello,\n\nPlease review our music catalog submission.\n\nTracks:\n'+db.catalog.map(x=>'- '+x.title+' – '+x.artist+(x.isrc?' | '+x.isrc:'')).join('\n')+'\n\nKind regards,\nLukulu Recordings';const u=`mailto:${encodeURIComponent(address)}?subject=${encodeURIComponent(sub)}&body=${encodeURIComponent(body.slice(0,1600))}`;window.location.href=u;}
function printSplit(id){const t=db.catalog.find(x=>String(x.id)===String(id));if(!t)return;let people;try{people=parseWriters(t.writers||'')}catch(er){return notify(er.message,true)}const total=people.reduce((n,x)=>n+x.pct,0);$('#print-target').innerHTML=`<h1>LUKULU RECORDINGS — SONG SPLIT SHEET</h1><p><b>Track:</b> ${ESC(t.title)}<br><b>Artist:</b> ${ESC(t.artist)}<br><b>ISRC:</b> ${ESC(t.isrc||'Not assigned')}<br><b>UPC:</b> ${ESC(t.upc||'Not assigned')}</p><h2>Writer and publishing shares</h2><table><thead><tr><th>Writer / contributor</th><th>Writer share (%)</th><th>Signature</th></tr></thead><tbody>${people.map(x=>`<tr><td>${ESC(x.name)}</td><td>${x.pct.toFixed(2)}%</td><td>________________</td></tr>`).join('')||'<tr><td colspan="3">No writer shares recorded</td></tr>'}<tr><th>Total</th><th>${total.toFixed(2)}%</th><td></td></tr></tbody></table><p><small>Draft generated ${ESC(new Date().toLocaleDateString('en-ZA'))}. All parties must review and sign. Does not replace a legal agreement.</small></p>`;if(Math.abs(total-100)>.01)notify('Writer shares do not total 100%; review before signing.',true);if(window.AndroidBridge&&typeof window.AndroidBridge.printHtml==='function'){window.AndroidBridge.printHtml($('#print-target').innerHTML);}else window.print()}
function openSearch(){const names=[...Object.entries(LABELS).map(([k,v])=>({name:v[0],detail:'Navigate',type:'page',id:k})),...TYPES.flatMap(type=>db[type].map(r=>({name:r.title||r.name||r.track||'Unnamed',detail:LABELS[type][0],type,id:r.id})))];$('#modal-root').innerHTML=`<div class="modal-backdrop"><div class="modal search-modal"><div class="modalhead"><h2>Search workspace</h2><button class="tiny" data-action="close">✕</button></div><input id="command-search" placeholder="Search records, or navigate..." autofocus><div class="search-results" id="search-results"></div><p class="kbd">Voice recognition is browser-dependent. Use the microphone on your keyboard if available.</p></div></div>`;const input=$('#command-search');const results=$('#search-results');const draw=()=>{const q=input.value.toLowerCase();results.innerHTML=names.filter(x=>(x.name+' '+x.detail).toLowerCase().includes(q)).slice(0,20).map(x=>`<button class="search-result" data-action="search-go" data-type="${x.type}" data-id="${attr(x.id)}">${ESC(x.name)}<small>${ESC(x.detail)}</small></button>`).join('')||'<p class="empty">No matches.</p>'};input.addEventListener('input',draw);draw();input.focus();}
function showAttention(){const a=attention();$('#modal-root').innerHTML=`<div class="modal-backdrop"><div class="modal"><div class="modalhead"><h2>Items that need attention</h2><button class="tiny" data-action="close">✕</button></div>${a.length?a.map(x=>`<div class="mini-row"><b>${ESC(x.label)}</b><small>${ESC(x.sub)}</small></div>`).join(''):'<p class="empty">No open tasks or pending registrations.</p>'}<div class="formfooter">${btn('go-tasks','Open task manager')}</div></div></div>`;}
function openUpload(type){importTarget=type;const f=$('#upload');f.value='';f.accept='.csv,text/csv';f.click()}
function openRestore(){importTarget='restore';const f=$('#upload');f.value='';f.accept='.json,application/json';f.click()}
async function uploadFile(e){const f=e.currentTarget.files?.[0];if(!f)return;if(f.size>15*1024*1024)return notify('File larger than 15 MB. Split CSV into smaller batches.',true);let s=await f.text();try{if(importTarget==='restore'){const x=JSON.parse(s),d=x.data||x;for(const k of TYPES)if(!Array.isArray(d[k]))throw Error('Backup missing '+k);if(!d.settings||typeof d.settings!=='object')throw Error('Invalid preferences');if(!confirm('Replace all locally saved Lukulu HQ records with this backup? Export the current data first.'))return;db=d;if(!persist())return;notify('Backup restored.')}else importCSV(importTarget,s);render()}catch(err){notify('Import failed: '+err.message,true)}}
function render(){nav();const node=$('#content');node.innerHTML=view==='dashboard'?dashboard():TYPES.includes(view)?dataTable(view):view==='integrations'?integrations():settings();}
function page(k){if(!LABELS[k])return;view=k;search='';selectFilter='all';close();render();window.scrollTo(0,0);}
function action(a,el){if(a==='close')return close();if(a==='backup')return backup();if(a==='restore')return openRestore();if(a==='clear-all'){if(confirm('Delete all data stored by Lukulu HQ on this device? This cannot be undone without a JSON backup.')){db=JSON.parse(JSON.stringify(window.LUKULU_SEED));persist();render();notify('Workspace reset to source samples.')}return}if(a==='save-settings'){db.settings.company=$('#company-input').value.trim();db.settings.publisherEmail=$('#publisher-input').value.trim();if(persist())notify('Preferences saved locally.');return}if(a==='email-draft')return submitEmailDraft();if(a==='go-integrations')return page('integrations');if(a==='go-tasks')return page('tasks');if(a==='edit')return openForm(el.dataset.type,el.dataset.id);if(a==='delete'){const t=el.dataset.type,id=el.dataset.id;const v=db[t].find(x=>String(x.id)===String(id));if(confirm(`Delete "${v?.title||v?.name||v?.track||'record'}"?`)){db[t]=db[t].filter(x=>String(x.id)!==String(id));persist();render();notify('Record deleted.')}return}if(a==='print-split')return printSplit(el.dataset.id);if(a.startsWith('add-'))return openForm(a.slice(4));if(a.startsWith('import-'))return openUpload(a.slice(7));if(a.startsWith('export-'))return exportCSV(a.slice(7));if(a==='search-go'){const type=el.dataset.type,id=el.dataset.id;if(type==='page')page(id);else{page(type);openForm(type,id)}return}}
document.addEventListener('click',e=>{const pageBtn=e.target.closest('[data-page]');if(pageBtn){page(pageBtn.dataset.page);return}const actionBtn=e.target.closest('[data-action]');if(actionBtn){action(actionBtn.dataset.action,actionBtn);return}if(e.target.matches('.modal-backdrop'))close()});document.addEventListener('input',e=>{if(e.target.id==='table-search'){search=e.target.value;let pos=e.target.selectionStart;render();const field=$('#table-search');field?.focus();field?.setSelectionRange(pos,pos)}});document.addEventListener('change',e=>{if(e.target.id==='filter'){selectFilter=e.target.value;render()}});document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}});$('#search-btn').addEventListener('click',openSearch);$('#notify-btn').addEventListener('click',showAttention);$('#upload').addEventListener('change',uploadFile);
if(!window.AndroidBridge&&'serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('SW registration failed',e));
render();
})();
</script></body></html>
