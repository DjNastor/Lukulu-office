name: Build Lukulu HQ Android Preview APK
on:
  push:
    branches: ["apk/lukulu-hq-v39-20261029"]
  workflow_dispatch:
  pull_request:
    branches: ["upgrade/v39-release-desk-20261029"]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Create offline Android WebView app
        shell: bash
        run: |
          mkdir -p app/src/main/assets app/src/main/java/za/co/lukulu/hq app/src/main/res/drawable
          cp index.html app/src/main/assets/index.html
          test -s app/src/main/assets/index.html
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "LukuluHQ"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'za.co.lukulu.hq'
            compileSdk 35
            defaultConfig {
              applicationId 'za.co.lukulu.hq'
              minSdk 24
              targetSdk 35
              versionCode 39
              versionName '0.39-preview'
            }
            buildTypes { release { minifyEnabled false } }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:allowBackup="false" android:label="Lukulu HQ"
                android:icon="@drawable/lukulu_icon"
                android:theme="@android:style/Theme.Material.NoActionBar"
                android:usesCleartextTraffic="false" android:supportsRtl="true">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/res/drawable/lukulu_icon.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
            <item>
              <shape android:shape="rectangle">
                <solid android:color="#09090b"/><corners android:radius="18dp"/>
              </shape>
            </item>
            <item android:left="16dp" android:top="16dp" android:right="16dp" android:bottom="16dp">
              <shape android:shape="rectangle">
                <stroke android:width="4dp" android:color="#d4af37"/>
                <corners android:radius="8dp"/>
              </shape>
            </item>
            <item android:left="24dp" android:top="24dp" android:right="24dp" android:bottom="24dp">
              <shape android:shape="rectangle">
                <solid android:color="#d4af37"/><corners android:radius="4dp"/>
              </shape>
            </item>
          </layer-list>
          EOF
          cat > app/src/main/java/za/co/lukulu/hq/MainActivity.java <<'EOF'
          package za.co.lukulu.hq;
          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.io.IOException;
          import java.io.InputStream;
          public class MainActivity extends Activity {
            private static final String HOME="https://appassets.androidplatform.net/assets/index.html";
            private WebView webView;
            private ValueCallback<Uri[]> filePicker;
            protected void onCreate(Bundle state) {
              super.onCreate(state);
              getWindow().setStatusBarColor(Color.rgb(9,9,11));
              getWindow().setNavigationBarColor(Color.rgb(9,9,11));
              webView=new WebView(this);
              webView.setBackgroundColor(Color.rgb(9,9,11));
              WebSettings s=webView.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setAllowFileAccess(false);
              s.setAllowContentAccess(true);
              s.setAllowFileAccessFromFileURLs(false);
              s.setAllowUniversalAccessFromFileURLs(false);
              s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
              webView.setWebViewClient(new WebViewClient() {
                @Override public WebResourceResponse shouldInterceptRequest(WebView view,WebResourceRequest request) {
                  Uri uri=request.getUrl();
                  if ("https".equals(uri.getScheme()) &&
                      "appassets.androidplatform.net".equals(uri.getHost()) &&
                      "/assets/index.html".equals(uri.getPath())) {
                    try {
                      InputStream in=getAssets().open("index.html");
                      return new WebResourceResponse("text/html","UTF-8",in);
                    } catch(IOException e) { return null; }
                  }
                  return null;
                }
                @Override public boolean shouldOverrideUrlLoading(WebView view,WebResourceRequest request) {
                  Uri u=request.getUrl();
                  if ("appassets.androidplatform.net".equals(u.getHost())) return false;
                  if (!request.isForMainFrame()) return false;
                  try { startActivity(new Intent(Intent.ACTION_VIEW,u)); }
                  catch (ActivityNotFoundException ignored) {}
                  return true;
                }
              });
              webView.setWebChromeClient(new WebChromeClient() {
                @Override public boolean onShowFileChooser(WebView view,ValueCallback<Uri[]> cb,FileChooserParams params) {
                  if (filePicker!=null) filePicker.onReceiveValue(null);
                  filePicker=cb;
                  try { startActivityForResult(params.createIntent(),42); return true; }
                  catch(ActivityNotFoundException e) { filePicker=null; return false; }
                }
              });
              setContentView(webView);
              webView.loadUrl(HOME);
            }
            @Override protected void onActivityResult(int code,int result,Intent data) {
              super.onActivityResult(code,result,data);
              if(code==42 && filePicker!=null) {
                filePicker.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(result,data));
                filePicker=null;
              }
            }
            @Override public void onBackPressed() {
              if(webView!=null && webView.canGoBack()) webView.goBack(); else super.onBackPressed();
            }
            @Override protected void onDestroy() {
              if(filePicker!=null) filePicker.onReceiveValue(null);
              if(webView!=null) webView.destroy();
              super.onDestroy();
            }
          }
          EOF
      - name: Build test APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK contents
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -1
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Lukulu-HQ-V39-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
