name: Deploy Lukulu HQ to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p _site
          touch _site/.nojekyll
          if [ -f index.html ]; then
            cp index.html _site/index.html
          elif [ -f public/index.html ]; then
            cp -a public/. _site/
          else
            echo "::error::No root index.html or public/index.html found. Set the correct web entry point."
            exit 1
          fi
          if [ -d assets ]; then cp -a assets _site/; fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
