name: Validate HQ development update
on:
  push:
    branches: ['upgrade/v42-review-and-packaging-20261125']
  pull_request:
    branches: ['upgrade/v41-operations-control-20261029']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm run build
