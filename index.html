<style id="lh40-styles">
/* V40 Release Desk — original Lukulu dark/gold palette; mobile first */
#lh40-launch{position:fixed;right:18px;bottom:calc(17px + env(safe-area-inset-bottom,0px));z-index:70;background:linear-gradient(110deg,#f1e2b8,#d4af37);color:#15110a;border:1px solid #d4af37;border-radius:999px;padding:12px 18px;min-height:44px;font:700 13px system-ui,sans-serif;box-shadow:0 12px 35px #0009;cursor:pointer}
#lh40-drawer[hidden],#lh40-scrim[hidden]{display:none!important}
#lh40-scrim{position:fixed;inset:0;z-index:79;background:#000b;backdrop-filter:blur(4px)}
#lh40-drawer{position:fixed;right:20px;top:50%;transform:translateY(-50%);z-index:80;width:min(500px,calc(100vw - 30px));max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;box-sizing:border-box;padding:22px;border:1px solid #d4af3766;background:linear-gradient(160deg,#242016,#08080a 72%);color:#f0ede6;border-radius:20px;box-shadow:0 24px 90px #000c;font:13px/1.5 system-ui,sans-serif}
#lh40-drawer *,#lh40-drawer *::before,#lh40-drawer *::after{box-sizing:border-box}
#lh40-drawer button,#lh40-drawer input,#lh40-drawer select,#lh40-drawer textarea{font:inherit}
#lh40-drawer button{cursor:pointer}
#lh40-drawer button:disabled{opacity:.35;cursor:not-allowed}
#lh40-drawer :focus-visible,#lh40-launch:focus-visible{outline:2px solid #f7d56e;outline-offset:3px}
#lh40-drawer h2{font-size:22px;color:#f1ddaf;letter-spacing:-.04em;font-weight:800;margin:0}#lh40-drawer h2 small{color:#c5a252;font-size:12px}
#lh40-drawer p{margin:2px 0 0;color:#bab4aa}#lh40-drawer .lh40-head{display:flex;align-items:start;justify-content:space-between;gap:12px}
#lh40-close{width:38px;height:38px;border-radius:10px;color:#fff;background:#18181a;border:1px solid #686358;flex:none}
#lh40-drawer .lh40-flags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 18px}
#lh40-drawer .lh40-flags span{background:#d4af371a;color:#f1d389;border:1px solid #d4af3730;padding:4px 9px;border-radius:20px;font-size:11px}
#lh40-drawer label{color:#ddd0b3;font-size:12px;font-weight:650}
#lh40-drawer input,#lh40-drawer textarea,#lh40-drawer select{background:#171719;border:1px solid #605a4e;color:#fff;border-radius:10px;padding:9px 10px;min-height:43px;width:100%}
#lh40-drawer input[type="date"]{color-scheme:dark}#lh40-drawer textarea{resize:vertical;min-height:64px}
#lh40-drawer .lh40-switch{display:grid;grid-template-columns:1fr auto auto;gap:7px;margin-top:5px}
#lh40-drawer .lh40-switch button{background:#29251d;border:1px solid #65573f;border-radius:9px;color:#e6c77e;padding:8px 11px;min-height:43px}
#lh40-drawer .lh40-releasebar{margin-bottom:12px}
#lh40-drawer .lh40-fields{display:grid;grid-template-columns:1fr 150px;gap:10px;margin-bottom:10px}
#lh40-drawer .lh40-fields input{display:block;margin-top:5px}
#lh40-drawer .lh40-notes{display:block}#lh40-drawer .lh40-notes textarea{display:block;margin-top:5px}
#lh40-drawer .lh40-progressline{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:15px;color:#f1ddaf}
#lh40-drawer progress{display:block;width:100%;height:9px;accent-color:#d4af37;margin:8px 0 13px}
#lh40-drawer .lh40-tasks{display:grid;list-style:none;gap:7px;padding:0;margin:0}
#lh40-drawer .lh40-tasks label{display:flex;align-items:center;gap:10px;border:1px solid #ffffff18;background:#ffffff09;border-radius:10px;min-height:43px;padding:10px 12px;cursor:pointer;color:#f0eae0;font-weight:500}
#lh40-drawer .lh40-tasks input{width:18px;height:18px;flex:none;min-height:18px;accent-color:#d4af37;margin:0}
#lh40-drawer .lh40-tasks label:has(:checked){border-color:#d4af3755;color:#c5c0b5}
#lh40-drawer .lh40-grouphead{color:#edcf8c;margin:15px 0 8px;border-top:1px solid #ffffff1c;padding-top:15px;font-weight:800}
#lh40-drawer .lh40-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#lh40-drawer .lh40-actions button,#lh40-drawer .lh40-import-label{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:10px;border:1px solid #5f4c2e;background:#231f19;color:#f0d7a6;font-size:12px;font-weight:700;text-align:center;padding:10px 8px}
#lh40-drawer .lh40-actions .lh40-primary{background:#d4af37;color:#16120a}
#lh40-drawer #lh40-import-file{max-width:100%;min-height:25px;border:0;padding:2px;background:transparent;font-size:10px;color:#e6d3a6}
#lh40-drawer .lh40-import-label{display:flex;flex-direction:column;gap:3px}
#lh40-drawer .lh40-notice{color:#f1cf84;min-height:15px;font-size:12px;margin-top:8px}
#lh40-drawer .lh40-disclaimer{border-top:1px solid #ffffff22;margin:12px 0 0;padding-top:10px;color:#aaa49b;font-size:11px}
#lh40-drawer .lh40-disclaimer strong{color:#e6d095}
@media(max-width:600px){#lh40-drawer{inset:auto 0 0 0;top:auto;right:0;transform:none;width:100%;max-height:93dvh;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}}
@media(max-width:355px){#lh40-drawer .lh40-fields,#lh40-drawer .lh40-actions{grid-template-columns:1fr}#lh40-drawer .lh40-switch{grid-template-columns:1fr auto auto}}
@media(prefers-reduced-motion:reduce){#lh40-drawer,#lh40-launch{scroll-behavior:auto;transition:none!important}}

</style>
</head>

    <div class="lh40-releasebar"><label for="lh40-select">Saved release drafts</label><div class="lh40-switch"><select id="lh40-select" aria-label="Choose release draft"></select><button id="lh40-new" type="button">+ New</button><button id="lh40-delete" type="button" title="Delete selected release" aria-label="Delete selected release">Delete</button></div></div>
    <div class="lh40-fields"><label for="lh40-release">Release title<input id="lh40-release" maxlength="140" placeholder="e.g. New chapter" autocomplete="off"></label><label for="lh40-date">Target date<input id="lh40-date" type="date"></label></div>
    <label class="lh40-notes" for="lh40-notes">Review notes<textarea id="lh40-notes" maxlength="2000" rows="2" placeholder="Missing splits, rights references, artwork checklist…"></textarea></label>
    <div class="lh40-progressline"><strong>Readiness checklist</strong><span id="lh40-count" aria-live="polite">0 of 8</span></div><progress id="lh40-progress" value="0" max="8" aria-label="Release readiness progress"></progress>
    <ul id="lh40-tasks" class="lh40-tasks"></ul>
    <div class="lh40-grouphead">Backup and planning</div>
    <div class="lh40-actions"><button id="lh40-export" type="button" class="lh40-primary">Export all drafts JSON</button><button id="lh40-calendar" type="button">Draft Calendar reminder</button><label class="lh40-import-label" for="lh40-import-file">Choose JSON backup<input id="lh40-import-file" type="file" accept=".json,application/json"></label><button id="lh40-import" type="button">Restore selected backup</button><button id="lh40-copy" type="button">Copy Tallyfy blueprint ID</button><button id="lh40-reset" type="button">Clear current checklist</button></div>
    <p class="lh40-notice" id="lh40-notice" aria-live="polite"></p>
    <p class="lh40-disclaimer"><strong>What is connected?</strong> This desk is an offline draft manager. No distributor submission, rights registration, Tallyfy process launch, Calendar event, email or social post is sent from this screen. Always export a backup before reinstalling the APK.</p>`;
  document.body.append(scrim,panel,launch);
  const $=id=>document.getElementById(id);
  const list=$('lh40-tasks');
  M.TASKS.forEach((t,i)=>{
    const li=document.createElement('li'),label=document.createElement('label');
    const box=document.createElement('input');box.type='checkbox';box.dataset.index=String(i);
    const span=document.createElement('span');span.textContent=t;
    label.append(box,span);li.append(label);list.append(li);
  });
  const boxes=Array.from(list.querySelectorAll('input'));
  const safeGet=k=>{try{return localStorage.getItem(k)}catch(_){return null}};
  let state=M.load(safeGet(M.STORE),safeGet(M.OLD_STORE));
  const active=()=>state.releases.find(r=>r.id===state.activeId)||state.releases[0];
  function notice(msg){$('lh40-notice').textContent=msg}
  function persist(){try{localStorage.setItem(M.STORE,JSON.stringify(state))}catch(_){notice('Storage unavailable; export drafts before closing.')}}
  function refresh(){
    const current=active();
    const select=$('lh40-select');select.replaceChildren();
    state.releases.forEach((r,i)=>{const option=document.createElement('option');option.value=r.id;option.textContent=r.title.trim()||'Untitled release '+(i+1);select.append(option)});
    select.value=current.id;
    $('lh40-release').value=current.title;
    $('lh40-date').value=current.date;
    $('lh40-notes').value=current.notes;
    boxes.forEach((box,i)=>box.checked=current.checks[i]);
    const count=current.checks.filter(Boolean).length;
    $('lh40-count').textContent=count+' of '+M.TASKS.length;
    $('lh40-progress').value=count;
    $('lh40-delete').disabled=state.releases.length===1;
  }
  persist(); refresh();
  $('lh40-select').addEventListener('change',e=>{state.activeId=e.target.value;persist();refresh();notice('Switched release draft.');});
  $('lh40-new').addEventListener('click',()=>{
    if(state.releases.length>=100){notice('Maximum 100 local release drafts. Export your backup first.');return}
    const release=M.createRelease();state.releases.push(release);state.activeId=release.id;persist();refresh();$('lh40-release').focus();notice('New draft created on this device.');
  });
  $('lh40-delete').addEventListener('click',()=>{
    if(state.releases.length<=1)return;
    if(!window.confirm('Delete this local release draft? This cannot be undone without a backup.'))return;
    state.releases=state.releases.filter(x=>x.id!==state.activeId);
    state.activeId=state.releases[0].id;persist();refresh();notice('Selected draft deleted locally.');
  });
  $('lh40-release').addEventListener('input',e=>{active().title=e.target.value;persist();refresh();});
  $('lh40-date').addEventListener('change',e=>{active().date=e.target.value;persist();notice('Date saved in this device.');});
  $('lh40-notes').addEventListener('input',e=>{active().notes=e.target.value;persist();});
  boxes.forEach((box,i)=>box.addEventListener('change',()=>{active().checks[i]=box.checked;persist();refresh();notice('Checklist saved locally. No external action taken.');}));
  $('lh40-reset').addEventListener('click',()=>{
    if(!window.confirm('Clear the eight checklist items for this release?'))return;
    active().checks=M.TASKS.map(()=>false);persist();refresh();notice('Current release checklist cleared.');
  });
  $('lh40-export').addEventListener('click',()=>{
    const payload=M.exportBackup(state);
    const json=JSON.stringify(payload,null,2);
    const file='lukulu-release-desk-v40-backup.json';
    if(navigator.userAgent.includes('LukuluHQAndroid/')){
      const bytes=new TextEncoder().encode(json);
      if(bytes.length>45000){notice('Backup too large for Android export. Reduce to fewer release drafts first.');return;}
      let binary='';for(const b of bytes)binary+=String.fromCharCode(b);
      const base64=btoa(binary);
      const url='https://appassets.androidplatform.net/__export?name='+encodeURIComponent(file)+'&data='+encodeURIComponent(base64);
      window.location.assign(url);notice('Android Save As dialog requested. No release was submitted.');
    }else{
      const blob=new Blob([json],{type:'application/json'});const url=URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=url;a.download=file;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
      notice('Backup exported. No release was submitted.');
    }
  });
  $('lh40-import').addEventListener('click',async()=>{
    const f=$('lh40-import-file').files[0];
    if(!f){notice('Choose a Lukulu V40 JSON backup file first.');return}
    if(f.size>500000){notice('Not a valid backup: file exceeds 500 KB.');return}
    let restored;
    try{restored=M.importBackup(await f.text())}catch(e){notice('Not a valid backup: '+e.message);return}
    if(!window.confirm('Replace ALL local Release Desk drafts with '+restored.releases.length+' drafts from this backup? Export your current drafts first.'))return;
    state=restored;persist();refresh();$('lh40-import-file').value='';notice('Backup restored. Changes are local to this device only.');
  });
  $('lh40-calendar').addEventListener('click',()=>{
    const link=M.calendarDraftUrl(active());
    if(!link){notice('Choose a valid target date first.');$('lh40-date').focus();return}
    const a=document.createElement('a');a.href=link;a.rel='noopener noreferrer';a.target='_blank';a.click();notice('Calendar draft opened for review; not saved automatically.');
  });
  $('lh40-copy').addEventListener('click',async()=>{
    try{await navigator.clipboard.writeText(M.TEMPLATE);notice('Tallyfy blueprint ID copied. No workflow started.');}
    catch(_){notice('Copy unavailable. Blueprint ID: '+M.TEMPLATE)}
  });
  let previousFocus=null;
  function open(){previousFocus=document.activeElement;panel.hidden=false;scrim.hidden=false;launch.setAttribute('aria-expanded','true');document.body.style.overflow='hidden';$('lh40-close').focus()}
  function close(){panel.hidden=true;scrim.hidden=true;launch.setAttribute('aria-expanded','false');document.body.style.overflow='';(previousFocus?.isConnected?previousFocus:launch).focus()}
  launch.addEventListener('click',open);$('lh40-close').addEventListener('click',close);scrim.addEventListener('click',close);
  document.addEventListener('keydown',e=>{
    if(panel.hidden)return;
    if(e.key==='Escape'){e.preventDefault();close();return}
    if(e.key==='Tab'){
      const focus=Array.from(panel.querySelectorAll('button:not(:disabled),input:not(:disabled),textarea,select,a[href]')).filter(x=>x.getClientRects().length);
      if(!focus.length)return;
      if(e.shiftKey&&document.activeElement===focus[0]){e.preventDefault();focus[focus.length-1].focus()}
      else if(!e.shiftKey&&document.activeElement===focus[focus.length-1]){e.preventDefault();focus[0].focus()}
    }
  });
})();

</script>
</body>
</html>
